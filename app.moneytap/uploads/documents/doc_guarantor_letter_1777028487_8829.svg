<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hero background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B8AB5" stop-opacity="0.18" />
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#F26B3A" stop-opacity="0.12" />
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="30%" r="55%">
      <stop offset="0" stop-color="#2B8AB5" stop-opacity="0.28" />
      <stop offset="1" stop-color="#2B8AB5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="60%">
      <stop offset="0" stop-color="#F26B3A" stop-opacity="0.20" />
      <stop offset="1" stop-color="#F26B3A" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <g filter="url(#blur)">
    <circle cx="520" cy="260" r="320" fill="url(#glow1)" />
    <circle cx="1180" cy="620" r="360" fill="url(#glow2)" />
  </g>
</svg>
